[package]
name = "xenos-shader"
description = "Xenos (Xbox 360 GPU) shader microcode to WGSL translation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
metal = ["dep:naga"]

[dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in", "msl-out"], optional = true }

[dev-dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
miniz_oxide = "=0.9.1"
