name: OwnedGameHost
options:
  minimumXcodeGenVersion: "2.44.0"
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  OwnedGameHost:
    type: application
    platform: iOS
    sources:
      - path: app
      - path: native/OwnedHostNative.mm
      - path: native/OwnedHostAudio.mm
      - path: sdk-test/native/NativeTraceSDKProbe.cpp
      - path: Resources/OwnedGuestBinding.json
        buildPhase: resources
      - path: Resources/PublicFixture
        type: folder
        buildPhase: resources
    dependencies:
      # This image must first enter via the checked loader, never dyld startup.
      - framework: Frameworks/PrivateGuest.framework
        embed: true
        link: false
        codeSign: false
        removeHeaders: false
      - framework: Frameworks/WgpuNative.framework
        embed: true
        codeSign: false
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Skyrim Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "9"
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.ownedgamehost
        # Keep the checked implementation/dependency graph in the app executable.
        ENABLE_DEBUG_DYLIB: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: app/OwnedHost-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/native $(SRCROOT)/app $(SRCROOT)/include"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -O2 -fexceptions -funwind-tables -ffp-model=strict"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Libraries"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        DEAD_CODE_STRIPPING: NO
        LD_EXPORT_DYNAMIC: YES
        OTHER_LDFLAGS: "$(inherited) -lios_owned_game_host -lc++ -lresolv -liconv -framework Foundation -framework UIKit -framework QuartzCore -framework Metal -framework AVFAudio -Wl,-undefined,error -Wl,-u,_OHPrepareV1 -Wl,-u,_OHAttachMetalLayerV1"
      configs:
        Debug:
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) OWNED_HOST_SDK_TRACE_TEST=1"
  OwnedGameHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: sdk-test/tests
    dependencies:
      - target: OwnedGameHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.ownedgamehost.tests
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/native $(SRCROOT)/app $(SRCROOT)/include"
        SWIFT_OBJC_BRIDGING_HEADER: app/OwnedHost-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OwnedGameHost.app/OwnedGameHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OwnedGameHost:
    build:
      targets:
        OwnedGameHost: all
        OwnedGameHostTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: OwnedGameHostTests
