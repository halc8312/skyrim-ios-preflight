name: ResidentAppleSDKProbe
options:
  minimumXcodeGenVersion: "2.44.0"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  ResidentAppleSDKProbe:
    type: application
    platform: iOS
    sources:
      - path: app
      - path: native
      - path: Resources
        buildPhase: resources
    dependencies:
      # Embed only: this must first load via the hash-checked Rust dlopen path.
      - framework: Frameworks/ResidentAppleFixture.framework
        embed: true
        link: false
        codeSign: false
        removeHeaders: false
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Resident Public Probe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.residentapplepublicprobe
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: include/Probe-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/include $(SRCROOT)/native"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -fexceptions -funwind-tables"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Libraries"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        DEAD_CODE_STRIPPING: NO
        LD_EXPORT_DYNAMIC: YES
        OTHER_LDFLAGS: "$(inherited) -lios_resident_apple_backend -lc++ -lresolv -liconv -framework Foundation -Wl,-u,_RAAppleRunPublicProbeV1"
  ResidentAppleSDKProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: ResidentAppleSDKProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.residentapplepublicprobe.tests
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/include"
        SWIFT_OBJC_BRIDGING_HEADER: include/Probe-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ResidentAppleSDKProbe.app/ResidentAppleSDKProbe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ResidentAppleSDKProbe:
    build:
      targets:
        ResidentAppleSDKProbe: all
        ResidentAppleSDKProbeTests: [test]
    test:
      config: Debug
      targets:
        - name: ResidentAppleSDKProbeTests
