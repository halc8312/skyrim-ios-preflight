# CANDIDATE ONLY. Not installed in .github/workflows; no job is authorized here.
# Keep the source repository PRIVATE. Free quotas are currently exhausted.
name: iOS public-source device build only
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed exact 40-character lowercase source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  device-build-only:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Require exact reviewed commit input
        shell: bash
        run: '[[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out reviewed source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Prepare pinned derivative without changing repository sources
        shell: bash
        run: |
          python3 ci/prepare-fix-build-route/prepare_route.py prepare \
            --repo "$GITHUB_WORKSPACE" --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/owned-build-only-route"
      - name: Build unsigned public device host with original compatibility gates
        shell: bash
        run: |
          SKYRT_OWNED_HOST_SCOPE='' python3 ci/run-bounded-command.py 1500 \
            bash "$RUNNER_TEMP/owned-build-only-route/preflight.sh"
      - name: Verify output and declare tests that were not executed
        shell: bash
        run: |
          python3 ci/prepare-fix-build-route/prepare_route.py verify \
            --repo "$GITHUB_WORKSPACE" --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/owned-build-only-route"
      - name: Retain only unsigned public result and bounded build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-host-device-build-only
          retention-days: 1
          if-no-files-found: error
          path: |
            out/owned-host/*.ipa
            out/owned-host/*.json
            out/owned-host/*.log
            out/owned-host/*.txt
            out/owned-host/gpu-framework/*.json
            out/owned-host/gpu-framework/*.txt
            out/owned-host/gpu-framework/*-export-policy/*.json
            out/owned-host/gpu-framework/*-export-policy/*.txt
