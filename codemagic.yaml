  ios-gpu-framework-preflight:
    name: iOS public GPU framework preflight
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    # Public source only; no app install, game input, or paid plan.
    scripts:
      - name: Build public Metal WebGPU frameworks
        script: |
          export WGPU_PREFLIGHT_WORK_DIR="$CM_BUILD_DIR/.wgpu-source-preflight"
          export WGPU_PREFLIGHT_OUTPUT_DIR="$CM_BUILD_DIR/out/gpu-framework"
          bash ci/gpu-framework/build_frameworks.sh
    artifacts:
      - out/gpu-framework/*.txt
      - out/gpu-framework/*.json
      - out/gpu-framework/*.log
      - out/gpu-framework/*-export-policy/*.json
      - out/gpu-framework/*-export-policy/*.txt
      - out/gpu-framework/device/WgpuNative.framework
      - out/gpu-framework/simulator/WgpuNative.framework
      - out/gpu-framework/device/CoexistenceLinkProbe
      - out/gpu-framework/simulator/CoexistenceLinkProbe
  ios-prepare-fix-device-build-only:
    name: iOS public-source device build only
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.6"
    # No triggering events. Existing full-verification workflows stay unchanged.
    scripts:
      - name: Build pinned public host only and retain honest scope evidence
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?Missing CI checkout}"
          : "${SKYRT_REVIEWED_SOURCE_COMMIT:?Supply independently reviewed source commit}"
          [[ "$SKYRT_REVIEWED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SKYRT_REVIEWED_SOURCE_COMMIT" = "${CM_COMMIT:?Missing CI commit}"
          route_parent="$(mktemp -d "${TMPDIR:-/tmp}/owned-build-only-route.XXXXXX")"
          route="$route_parent/derived"
          python3 ci/prepare-fix-build-route/prepare_route.py prepare \
            --repo "$CM_BUILD_DIR" --source-commit "$SKYRT_REVIEWED_SOURCE_COMMIT" --output "$route"
          SKYRT_OWNED_HOST_SCOPE='' python3 ci/run-bounded-command.py 1500 bash "$route/preflight.sh"
          python3 ci/prepare-fix-build-route/prepare_route.py verify \
            --repo "$CM_BUILD_DIR" --source-commit "$SKYRT_REVIEWED_SOURCE_COMMIT" --output "$route"
    artifacts:
      - out/owned-host/*.ipa
      - out/owned-host/*.json
      - out/owned-host/*.log
      - out/owned-host/*.txt
      - out/owned-host/gpu-framework/*.json
      - out/owned-host/gpu-framework/*.txt
      - out/owned-host/gpu-framework/*-export-policy/*.json
      - out/owned-host/gpu-framework/*-export-policy/*.txt
  skyrim-pc-aot-probe-unsigned:
    name: Skyrim 2011 PC AOT - native probe compile only
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: "26.6"
    # Manual-only, private, no original or generated game inputs.
    scripts:
      - name: Validate and build independent PC AOT probe
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/pc-aot"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash scripts/build-ios.sh unsigned
    artifacts:
      - pc-aot/local/ci/*/artifacts/*
# Append this manual workflow under workflows in the existing private harness.
  pc2011-title-host:
    name: Skyrim PC 2011 original-guest iPhoneOS host
    instance_type: mac_mini_m2
    max_build_duration: 65
    environment:
      xcode: "26.6"
      vars:
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        JOBS: "2"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/pc-aot/local/ios-dependencies
        - $CM_BUILD_DIR/pc-aot/local/ios-dependencies-displayfix
        - $CM_BUILD_DIR/pc-aot/local/ios-dependencies-cachefix
        - $CM_BUILD_DIR/pc-aot/local/ios-dependencies-build6
        - $CM_BUILD_DIR/pc-aot/local/ios-dependencies-build7
        - $CM_BUILD_DIR/pc-aot/local/ios-dependencies-shader-trials-v1
        - $CM_BUILD_DIR/pc-aot/local/ios-dependencies-build9
    scripts:
      - name: Prepare public iPhoneOS build tools
        script: |
          set -euo pipefail
          brew install bison make cmake
      - name: Build public SDL DXVK Metal runtime without game inputs
        script: |
          set -euo pipefail
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix make)/libexec/gnubin:$PATH"
          bash pc-aot/scripts/build-title-host.sh
    artifacts:
      - pc-aot/local/title-host/*/artifacts/*
      - pc-aot/local/ios-dependencies/logs/*/*.log
      - pc-aot/local/ios-dependencies-displayfix/logs/*/*.log
      - pc-aot/local/ios-dependencies-cachefix/logs/*/*.log
      - pc-aot/local/ios-dependencies-build6/logs/*/*.log
      - pc-aot/local/ios-dependencies-build7/logs/*/*.log
      - pc-aot/local/ios-dependencies-shader-trials-v1/logs/*/*.log
      - pc-aot/local/ios-dependencies-build9/logs/*/*.log
