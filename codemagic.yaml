  ios-resident-kernel-preflight:
    name: iOS public resident Kernel preflight
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    # Manual only. Reuse earlier full-run evidence, never claim it ran here.
    scripts:
      - name: Build and test the isolated public resident Kernel app
        script: bash ci/run-ios-resident-preflight.sh
    artifacts:
