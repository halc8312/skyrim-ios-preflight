# Run manually from a personal Codemagic account with free M2 minutes remaining.
# No code-signing credentials, game data, or generated game code are inputs.
workflows:
  ios-source-only-preflight:
    name: iOS source-only preflight
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    # No triggering events: this workflow is manual only.
    scripts:
      - name: Build source-only iOS libraries and diagnostic app
        script: bash ci/run-ios-preflight.sh
    artifacts:
      - out/ios-synthetic/libskyrim_guest.a
      - out/ios-probe/SkyrimProbe-0.2.0-unsigned.ipa
      - out/ios-probe/libxenos_probe_bridge.a
      - out/ios-probe/runtime-exports.txt
      - out/native-tests/*.log
      - out/ios-simulator/*.log
      - out/ios-simulator/*.png
      - out/ios-simulator/*.xcresult
      - out/signing-binding/*.json
      - out/signing-binding/*.log
      - out/signing-binding/*.txt
      - out/signing-binding/*.bin
      - out/resident-sdk/*.log
      - out/resident-sdk/*.txt
      - out/resident-sdk/*.ll
      - out/resident-sdk/*.json
      - out/resident-sdk/*.bin
      - out/resident-sdk/xctest/*.log
      - out/resident-sdk/xctest/*.json
      - out/resident-sdk/xctest/*.xcresult
  ios-resident-kernel-preflight:
    name: iOS public resident Kernel preflight
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    # Manual only. Reuse earlier full-run evidence, never claim it ran here.
    scripts:
      - name: Build and test the isolated public resident Kernel app
        script: bash ci/run-ios-resident-preflight.sh
    artifacts:
      - out/resident-sdk/*.log
      - out/resident-sdk/*.txt
      - out/resident-sdk/*.ll
      - out/resident-sdk/*.json
      - out/resident-sdk/*.bin
      - out/resident-sdk/xctest/*.log
      - out/resident-sdk/xctest/*.json
      - out/resident-sdk/xctest/*.xcresult
  ios-owned-host-preflight:
    name: iOS public owned-host integration
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    # Manual only. No title data, generated guest code, signing account or key.
    scripts:
      - name: Build and test the public owned host with Metal
        script: bash ci/run-ios-owned-host-preflight.sh
    artifacts:
      - out/owned-host/*.ipa
      - out/owned-host/*.json
      - out/owned-host/*.log
      - out/owned-host/*.txt
      - out/owned-host/*.ll
      - out/owned-host/*.bin
      - out/owned-host/audio-hang/*.txt
      - out/owned-host/audio-hang/*.log
      - out/owned-host/audio-hang/*.json
      - out/owned-host/gpu-framework/*.txt
      - out/owned-host/gpu-framework/*.json
      - out/owned-host/gpu-framework/*.log
      - out/owned-host/gpu-framework/*-export-policy/*.json
      - out/owned-host/gpu-framework/*-export-policy/*.txt
      - out/owned-host/gpu-framework/device/WgpuNative.framework
      - out/owned-host/gpu-framework/simulator/WgpuNative.framework
      - out/owned-host/xctest/*.log
      - out/owned-host/xctest/*.txt
      - out/owned-host/xctest/*.json
      - out/owned-host/xctest/*.xcresult
      - out/owned-host/xctest-mobile/*.log
      - out/owned-host/xctest-mobile/*.txt
      - out/owned-host/xctest-mobile/*.json
      - out/owned-host/xctest-mobile/*.xcresult
      - out/owned-host/xctest-mobile/screenshots/*
      - out/owned-host/xctest-device-features/*.json
      - out/owned-host/xctest-device-features/*/*.log
      - out/owned-host/xctest-device-features/*/*.txt
      - out/owned-host/xctest-device-features/*/*.json
      - out/owned-host/xctest-device-features/*/*.xcresult
      - out/owned-host/xctest-device-features/*/screenshots/*
  ios-gpu-framework-preflight:
    name: iOS public GPU framework preflight
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    # Public source only; no app install, game input, or paid plan.
    scripts:
      - name: Build public Metal WebGPU frameworks
        script: |
          export WGPU_PREFLIGHT_WORK_DIR="$CM_BUILD_DIR/.wgpu-source-preflight"
          export WGPU_PREFLIGHT_OUTPUT_DIR="$CM_BUILD_DIR/out/gpu-framework"
          bash ci/gpu-framework/build_frameworks.sh
    artifacts:
      - out/gpu-framework/*.txt
      - out/gpu-framework/*.json
      - out/gpu-framework/*.log
      - out/gpu-framework/*-export-policy/*.json
      - out/gpu-framework/*-export-policy/*.txt
      - out/gpu-framework/device/WgpuNative.framework
      - out/gpu-framework/simulator/WgpuNative.framework
      - out/gpu-framework/device/CoexistenceLinkProbe
      - out/gpu-framework/simulator/CoexistenceLinkProbe
