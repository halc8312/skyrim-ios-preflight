# Run manually from a personal Codemagic account with free M2 minutes remaining.
# No code-signing credentials, game data, or generated game code are inputs.
workflows:
  pc2011-host-wait-checks:
    name: Skyrim isolated Apple lock and thread checks
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      xcode: "26.6"
    # Manual only; authored host checks, not an app build or iPhone comparison.
    scripts:
      - name: Check independent lock and thread trials with Apple APIs
        script: bash pc-aot/scripts/check-host-wait-mac.sh
    artifacts:
      - pc-aot/local/host-wait-checks/*/*.log
  pc2011-self-build-tools:
    name: Skyrim owned-copy helper checks
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      xcode: "26.6"
    # Manual only. Synthetic fixtures; no game, account, profile or key inputs.
    scripts:
      - name: Check guest linker and signing helpers with real Apple tools
        script: |
          set -euo pipefail
          mkdir -p out/self-build-checks
          exec > >(tee out/self-build-checks/checks.log) 2>&1
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          cd pc-aot
          python3 scripts/check-public-tree.py
          status=0
          for suite in test_build_title_guest.py test_title_assembly.py test_title_signing.py test_owned_data.py; do
            python3 -m unittest discover -s tests -p "$suite" -v || status=1
          done
          exit "$status"
    artifacts:
      - out/self-build-checks/*.log
  ios-audio-environment-diagnostic:
    name: iOS minimal audio environment diagnostic
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      xcode: latest
    # Manual public diagnostic only. Existing integration gates stay mandatory.
    scripts:
      - name: Compare minimal real audio output without the game or XCTest
        script: bash ci/run-ios-audio-environment.sh
    artifacts:
      - out/audio-environment-driver/*.log
      - out/audio-environment-driver/*.txt
      - out/audio-environment-driver/*.json
      - out/audio-environment
      - out/audioqueue-environment
  ios-audio-environment-xcode264-diagnostic:
    name: iOS minimal audio environment diagnostic (Xcode 26.4)
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      xcode: "26.4"
      vars:
        SKYRT_AUDIO_SIMULATOR_VERSION: "26.4.1"
    # Manual public diagnostic only. Existing integration gates stay mandatory.
    scripts:
      - name: Compare minimal real audio output without the game or XCTest
        script: bash ci/run-ios-audio-environment.sh
    artifacts:
      - out/audio-environment-driver/*.log
      - out/audio-environment-driver/*.txt
      - out/audio-environment-driver/*.json
      - out/audio-environment
      - out/audioqueue-environment
  ios-source-only-preflight:
    name: iOS source-only preflight
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    # No triggering events: this workflow is manual only.
    scripts:
      - name: Build source-only iOS libraries and diagnostic app
        script: bash ci/run-ios-preflight.sh
    artifacts:
      - out/ios-synthetic/libskyrim_guest.a
      - out/ios-probe/SkyrimProbe-0.2.0-unsigned.ipa
      - out/ios-probe/libxenos_probe_bridge.a
      - out/ios-probe/runtime-exports.txt
      - out/native-tests/*.log
      - out/ios-simulator/*.log
      - out/ios-simulator/*.png
      - out/ios-simulator/*.xcresult
      - out/signing-binding/*.json
      - out/signing-binding/*.log
      - out/signing-binding/*.txt
      - out/signing-binding/*.bin
      - out/resident-sdk/*.log
      - out/resident-sdk/*.txt
      - out/resident-sdk/*.ll
      - out/resident-sdk/*.json
