# Candidate only: install at .circleci/config.yml after separate approval.
version: 2.1

parameters:
  run_public_build_and_ui:
    type: boolean
    default: false
  reviewed_source_commit:
    type: string
    default: ""

jobs:
  public_build_and_ui:
    macos:
      xcode: "26.6.0"
    resource_class: m4pro.medium
    working_directory: ~/skyrim-ios-preflight
    environment:
      PUBLIC_BUILD_AND_UI_ENABLED: "<< pipeline.parameters.run_public_build_and_ui >>"
      REVIEWED_SOURCE_COMMIT: "<< pipeline.parameters.reviewed_source_commit >>"
      DEVELOPER_DIR: /Applications/Xcode-26.6.app/Contents/Developer
      SKYRT_OWNED_HOST_SCOPE: ""
    steps:
      - checkout
      - run:
          name: Build the public device app and run Simulator UI evidence once
          # Inactivity only; the existing inner stage guard is still 1500s.
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            route_parent="$(mktemp -d "${TMPDIR:-/tmp}/public-ui-route.XXXXXX")"
            route="$route_parent/prepared"
            python3 -B ci/prepare-mobile-build-route/prepare_ui_route.py prepare \
              --repo "$PWD" --source-commit "$REVIEWED_SOURCE_COMMIT" --output "$route"
            preflight_status=0
            bash "$route/preflight.sh" || preflight_status=$?
            recheck_status=0
            python3 -B ci/prepare-mobile-build-route/prepare_ui_route.py recheck \
              --repo "$PWD" --source-commit "$REVIEWED_SOURCE_COMMIT" --output "$route" || recheck_status=$?
            # Preserve proof on failure and avoid storing rebuildable caches twice.
            python3 -B ci/run-bounded-command.py 120 python3 -B - <<'PY'
            from pathlib import Path
            import os, shutil
            source=Path("out/owned-host")
            evidence=Path("out/public-evidence/owned-host")
            review=Path("out/public-review")
            excluded={"DerivedData","gpu-framework"}
            limit=100<<20
            def retained_size():
                total=0
                for parent,dirs,files in os.walk(source,followlinks=False):
                    dirs[:]=[n for n in dirs if n not in excluded and not (".xcresult" in excluded and n.endswith(".xcresult"))]
                    for name in [*dirs,*files]:
                        assert not (Path(parent)/name).is_symlink(), "public_evidence_symlink"
                    total+=sum((Path(parent)/name).stat().st_size for name in files)
                return total
            if retained_size()>limit: excluded.add(".xcresult")
            size=retained_size()
            assert size<=limit, "bounded_public_evidence_required"
            def ignore(parent,names):
                return [n for n in names if n in excluded or (".xcresult" in excluded and n.endswith(".xcresult"))]
            shutil.copytree(source,evidence,ignore=ignore)
            review.mkdir(exist_ok=False)
            archive=Path(shutil.make_archive(str(review/"SkyrimLab-build15-metal-frame-review"),"zip","out/public-evidence","owned-host"))
            assert archive.stat().st_size<=110<<20, "bounded_public_archive_required"
            print("PUBLIC_COMPACT_EVIDENCE",size,"raw_xcresult_omitted="+str(".xcresult" in excluded),flush=True)
            PY
            if [ "$preflight_status" -ne 0 ]; then exit "$preflight_status"; fi
            exit "$recheck_status"
      - store_artifacts:
          path: out/public-evidence/owned-host
          destination: public-device-build-and-ui-evidence
      - store_artifacts:
          path: out/public-review
          destination: public-review-download

workflows:
  manually_requested_public_build_and_ui:
    when: << pipeline.parameters.run_public_build_and_ui >>
    jobs:
      - public_build_and_ui
