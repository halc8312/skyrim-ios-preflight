# Candidate only: install at .circleci/config.yml after separate approval.
version: 2.1

parameters:
  run_public_device_build:
    type: boolean
    default: false
  reviewed_source_commit:
    type: string
    default: ""

jobs:
  public_device_build:
    macos:
      xcode: "26.6.0"
    resource_class: m4pro.medium
    working_directory: ~/skyrim-ios-preflight
    environment:
      PUBLIC_DEVICE_BUILD_ENABLED: "<< pipeline.parameters.run_public_device_build >>"
      REVIEWED_SOURCE_COMMIT: "<< pipeline.parameters.reviewed_source_commit >>"
      DEVELOPER_DIR: /Applications/Xcode-26.6.app/Contents/Developer
      SKYRT_OWNED_HOST_SCOPE: ""
    steps:
      - checkout
      - run:
          name: Build the reviewed public device-only route
          # Inactivity only. The reused stage retains its own 1500-second guard;
          # CircleCI Free has a 60-minute job ceiling, not a 30-minute guarantee.
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            python3 -B .circleci/check_manual_request.py
            route_parent="$(mktemp -d "${TMPDIR:-/tmp}/public-circle-route.XXXXXX")"
            route="$route_parent/prepared"
            python3 -B ci/prepare-fix-build-route/prepare_route.py prepare \
              --repo "$PWD" --source-commit "$REVIEWED_SOURCE_COMMIT" --output "$route"
            bash "$route/preflight.sh"
            python3 -B ci/prepare-fix-build-route/prepare_route.py verify \
              --repo "$PWD" --source-commit "$REVIEWED_SOURCE_COMMIT" --output "$route"
      # CircleCI retains available failure artifacts too; their presence is not
      # a successful-build assertion. Only the existing verify step emits that.
      - store_artifacts:
          path: out/owned-host
          destination: public-device-build-only

workflows:
  manually_requested_public_device:
    when: << pipeline.parameters.run_public_device_build >>
    jobs:
      - public_device_build
