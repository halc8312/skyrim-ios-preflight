name: iOS source-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-sdk-preflight:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out only the build harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build open-source libraries and synthetic iOS guest stubs
        run: bash ci/run-ios-preflight.sh
      - name: Retain the synthetic library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-synthetic-arm64-library
          path: out/ios-synthetic/libskyrim_guest.a
          if-no-files-found: error
          retention-days: 3
