name: Skyrim PC AOT native probe (branch only)

on:
  workflow_dispatch:
    inputs:
      classic_skse:
        description: Run the unsigned Classic SKSE component checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apple-sdk-preflight:
    if: ${{ !inputs.classic_skse }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out only the build harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate isolated source and fixtures
        working-directory: pc-aot
        run: |
          set -euo pipefail
          mkdir -p local/ci/preflight/artifacts
          python3 scripts/check-public-tree.py 2>&1 | tee local/ci/preflight/artifacts/source-check.log
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee local/ci/preflight/artifacts/tests.log
      - name: Compile and link iPhoneOS ARM64 native probe
        run: bash pc-aot/scripts/build-ios.sh unsigned
      - name: Preserve verified device build before simulator execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skyrim-pc-aot-unsigned-device-probe
          path: pc-aot/local/ci/*/artifacts/*
          if-no-files-found: error
          retention-days: 7
      - name: Execute separate native macOS and iOS Simulator checks
        run: bash pc-aot/scripts/test-probe-simulator.sh
        timeout-minutes: 20
      - name: Retain private unsigned probe and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skyrim-pc-aot-unsigned-probe
          path: |
            pc-aot/local/ci/*/artifacts/*
            pc-aot/local/simulator/*/*.log
            pc-aot/local/simulator/*/*.txt
            pc-aot/local/simulator/*/scope.json
            pc-aot/local/simulator/*/*.png
            pc-aot/local/simulator/*/ProbeUITests.xcresult
            pc-aot/local/simulator/*/attachments/**
            pc-aot/local/simulator/*/app-logs/*.log
          if-no-files-found: error
          retention-days: 7

  classic-skse-apple:
    if: ${{ inputs.classic_skse }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Execute macOS fixtures and compile and link iPhoneOS components
        working-directory: pc-aot
        run: python3 scripts/check_classic_apple.py
