name: iOS source-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-sdk-preflight:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out only the build harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build source-only iOS libraries and diagnostic app
        run: bash ci/run-ios-preflight.sh
      - name: Retain unsigned diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-source-only-diagnostic
          path: |
            out/ios-synthetic/libskyrim_guest.a
            out/ios-probe/SkyrimProbe-0.2.0-unsigned.ipa
            out/ios-probe/libxenos_probe_bridge.a
            out/ios-probe/runtime-exports.txt
            out/native-tests/*.log
            out/ios-simulator/*.log
            out/ios-simulator/*.png
            out/ios-simulator/*.xcresult
          if-no-files-found: error
          retention-days: 3
