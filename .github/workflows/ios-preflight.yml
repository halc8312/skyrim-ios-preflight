name: Skyrim PC AOT native probe (branch only)

on:
  workflow_dispatch:
    inputs:
      full_title_host:
        description: Build the unsigned standard iPhone app and run the MOD simulator tests
        type: boolean
        default: false
      classic_trial:
        description: Include the per-profile SkyUI 5.1 trial in the unsigned standard iPhone app
        type: boolean
        default: false
      first_wave_trial:
        description: Build the unsigned iPhone host with the opt-in Fuz and PapyrusUtil trials
        type: boolean
        default: false
      dll_probe:
        description: Check the isolated LE DLL diagnostic with the device SDK and simulator
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apple-sdk-preflight:
    if: ${{ !inputs.full_title_host && !inputs.classic_trial && !inputs.dll_probe && !inputs.first_wave_trial }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out only the build harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate isolated source and fixtures
        working-directory: pc-aot
        run: |
          set -euo pipefail
          mkdir -p local/ci/preflight/artifacts
          python3 scripts/check-public-tree.py 2>&1 | tee local/ci/preflight/artifacts/source-check.log
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee local/ci/preflight/artifacts/tests.log
      - name: Compile and link iPhoneOS ARM64 native probe
        run: bash pc-aot/scripts/build-ios.sh unsigned
      - name: Preserve verified device build before simulator execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skyrim-pc-aot-unsigned-device-probe
          path: pc-aot/local/ci/*/artifacts/*
          if-no-files-found: error
          retention-days: 7
      - name: Execute separate native macOS and iOS Simulator checks
        run: bash pc-aot/scripts/test-probe-simulator.sh
        timeout-minutes: 20
      - name: Retain private unsigned probe and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skyrim-pc-aot-unsigned-probe
          path: |
            pc-aot/local/ci/*/artifacts/*
            pc-aot/local/simulator/*/*.log
            pc-aot/local/simulator/*/*.txt
            pc-aot/local/simulator/*/scope.json
            pc-aot/local/simulator/*/*.png
            pc-aot/local/simulator/*/ProbeUITests.xcresult
            pc-aot/local/simulator/*/attachments/**
            pc-aot/local/simulator/*/app-logs/*.log
          if-no-files-found: error
          retention-days: 7

  standard-title-host:
    if: ${{ inputs.full_title_host || inputs.classic_trial || inputs.first_wave_trial }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: '18.0'
      SKYRIM_IOS_CLASSIC_SKSE: ${{ (inputs.classic_trial || inputs.first_wave_trial) && '1' || '0' }}
      SKYRIM_IOS_SKSE_DLL_PROBE: ${{ (inputs.dll_probe || inputs.first_wave_trial) && '1' || '0' }}
      SKYRIM_IOS_MOD_HOOKS: ${{ inputs.first_wave_trial && '1' || '0' }}
      SKYRIM_IOS_CLASSIC_PAPYRUSUTIL: ${{ inputs.first_wave_trial && '1' || '0' }}
      JOBS: '2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check the installer against the iPhoneOS SDK
        working-directory: pc-aot/ios/runtime-port
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -sdk "$sdk" -target arm64-apple-ios18.0 -swift-version 6 \
            -strict-concurrency=complete -warnings-as-errors -parse-as-library -typecheck mod_translate.swift
          defs=()
          if [[ "$SKYRIM_IOS_CLASSIC_SKSE" == 1 ]]; then
            defs=(-DSKYRIM_IOS_CLASSIC_SKSE=1 -I../private-abi)
          fi
          xcrun --sdk iphoneos clang -isysroot "$sdk" -target arm64-apple-ios18.0 -fobjc-arc -fmodules \
            "${defs[@]}" -fsyntax-only mod_manager.m mod_fomod.m
      - name: Prepare the public build tools
        run: |
          set -euo pipefail
          brew install bison make cmake
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build the standard iPhone app and exercise the MOD screens
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/title-host.log"
          if ! bash pc-aot/scripts/build-title-host.sh > "$log" 2>&1; then
            grep -Em 50 '^(FAILED|ERROR|FAIL:|CMake Error|fatal:)|: error:|FAILED:|failed;|Missing |Unexpected |mismatch' "$log" || true
            tail -n 60 "$log"
            exit 1
          fi
          tail -n 15 "$log"
      - name: Verify the translation bridge in the iPhone executable
        working-directory: pc-aot
        run: |
          set -euo pipefail
          runs=(local/title-host/run-*)
          test "${#runs[@]}" -eq 1
          output="${runs[0]}/artifacts"
          grep -Fq ' _OBJC_CLASS_$_SKTranslator' "${runs[0]}/app-symbols.txt"
          grep -Fq '/Translation.framework/Translation' "$output/linked-libraries.txt"
          grep -Fq '/SwiftUI.framework/SwiftUI' "$output/linked-libraries.txt"
          python3 - "$(xcrun --sdk iphoneos --show-sdk-path)" "$output/ios-swift-sdk-stubs.txt" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          sdk, output = map(Path, sys.argv[1:])
          names = sorted({p.name for p in (sdk / "usr/lib/swift").glob("libswift*.tbd") if p.is_file()})
          listing = "".join(name + "\n" for name in names).encode("utf-8")
          output.write_bytes(listing)
          result = output.with_name("result.json")
          record = json.loads(result.read_text())
          record["ios_swift_sdk_stubs_sha256"] = hashlib.sha256(listing).hexdigest()
          result.write_text(json.dumps(record, indent=2) + "\n")
          PY
      - name: Save the source-only iPhone host and public ABI headers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standard-title-host
          path: |
            pc-aot/local/title-host/run-*/artifacts/SkyrimIOS-public-host.zip
            pc-aot/local/title-host/run-*/artifacts/result.json
            pc-aot/local/title-host/run-*/artifacts/platform.txt
            pc-aot/local/title-host/run-*/artifacts/linked-libraries.txt
            pc-aot/local/title-host/run-*/artifacts/ios-swift-sdk-stubs.txt
            pc-aot/local/title-host/run-*/artifacts/*.h
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Keep compiler and simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standard-title-host-checks
          path: |
            ${{ runner.temp }}/title-host.log
            pc-aot/local/title-host/run-*/artifacts/mod-simulator*.zip
            pc-aot/local/title-host/run-*/mod-simulator/evidence/*.log
            pc-aot/local/title-host/run-*/mod-dll-simulator/evidence/*.log
          if-no-files-found: warn
          retention-days: 1

  dll-probe-sdk:
    if: ${{ inputs.dll_probe }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile the device sources and run the isolated simulator fixture
        run: |
          set -euo pipefail
          bash pc-aot/experiments/skse-plugin-vm/test-apple-sdk.sh | tee "$RUNNER_TEMP/dll-sdk.log"
          grep -q '^DLL_SIMULATOR: english verified ' "$RUNNER_TEMP/dll-sdk.log"
          grep -q '^DLL_SIMULATOR: japanese verified ' "$RUNNER_TEMP/dll-sdk.log"
