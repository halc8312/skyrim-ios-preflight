name: SkyrimProbe
options:
  minimumXcodeGenVersion: "2.44.0"
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  SkyrimProbe:
    type: application
    platform: iOS
    sources:
      - path: app
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Skyrim Probe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.skyrimprobe
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: app/Probe-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/bridge/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Libraries"
        OTHER_LDFLAGS: "$(inherited) -lxenos_probe_bridge -lskyrim_guest -liconv"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  SkyrimProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: SkyrimProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.skyrimprobe.tests
        # Importing the app's Swift module also scans its C bridging header.
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/bridge/include"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SkyrimProbe.app/SkyrimProbe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SkyrimProbe:
    build:
      targets:
        SkyrimProbe: all
        SkyrimProbeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: SkyrimProbeTests
