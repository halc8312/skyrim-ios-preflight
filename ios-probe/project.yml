name: SkyrimProbe
options:
  minimumXcodeGenVersion: "2.44.0"
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  SkyrimProbe:
    type: application
    platform: iOS
    sources:
      - path: app
      - path: cpu-fixture
    dependencies:
      - framework: Frameworks/SyntheticGuest.framework
        embed: true
        codeSign: false
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Skyrim Probe
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.skyrimprobe
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: app/Probe-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/bridge/include $(SRCROOT)/cpu-fixture $(SRCROOT)/Support $(SRCROOT)/Support/simde"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_OPTIMIZATION_LEVEL: "2"
        DEAD_CODE_STRIPPING: NO
        LD_EXPORT_DYNAMIC: YES
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -O2 -fexceptions -funwind-tables -ffp-model=strict"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Libraries"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lxenos_probe_bridge -lskyrim_guest -liconv -lc++ -Wl,-u,_probe_runtime_context_layout -Wl,-u,_probe_runtime_cpu_roundtrip -Wl,-u,_probe_runtime_memory_selftest -Wl,-u,_probe_runtime_component_checks -Wl,-u,_probe_runtime_catch_cpp_unwind"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  SkyrimProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: SkyrimProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halc8312.skyrimprobe.tests
        # Importing the app's Swift module also scans its C bridging header.
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/bridge/include $(SRCROOT)/cpu-fixture"
        SWIFT_OBJC_BRIDGING_HEADER: tests/CpuProbe-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SkyrimProbe.app/SkyrimProbe"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SkyrimProbe:
    build:
      targets:
        SkyrimProbe: all
        SkyrimProbeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: SkyrimProbeTests
